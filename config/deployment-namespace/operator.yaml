# Applied by the top pipeline in each deployment namespace, after labelling it tacplus.dev/deployment:
#   NAMESPACE=tac-<deployment> envsubst '$NAMESPACE' < operator.yaml | kubectl apply -f -
# It lets the deployment's operator, and no other service account, ask nsproxy for tenant namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nsproxy-tenantnamespaces
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [nsproxy.tacplus.dev]
    resources: [tenantnamespaces]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nsproxy-tenantnamespaces
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nsproxy-tenantnamespaces
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: ${NAMESPACE}
