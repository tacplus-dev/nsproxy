# The contract with every deployment's operator. Written by hand; the Go types are in api/v1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantnamespaces.nsproxy.tacplus.dev
spec:
  group: nsproxy.tacplus.dev
  scope: Namespaced
  names:
    kind: TenantNamespace
    listKind: TenantNamespaceList
    plural: tenantnamespaces
    singular: tenantnamespace
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tid
          type: string
          jsonPath: .spec.tid
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [tid]
              properties:
                tid:
                  description: >-
                    The tenant id: exactly 8 characters of [0-9a-z], immutable. An all-digit tid is reserved
                    for the platform and accepted only for the reserved ids nsproxy is configured with.
                  type: string
                  pattern: '^[0-9a-z]{8}$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: tid is immutable
            status:
              type: object
              properties:
                namespace:
                  description: The tenant namespace, tac-<deployment>-<tid>, once nsproxy has it in place.
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
